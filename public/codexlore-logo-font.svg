<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 838" width="1536" height="838" role="img" aria-label="CodexLore logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>CodexLore</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Russo+One&amp;display=swap');
      :root { --ink:#0b0b0b; --yellow:#ffe600; --pink:#ff4fa8; --teal:#00a8c6; --paper:#f8f9f9; }
      .word { font-family:'Russo One','Black Ops One',Impact,'Arial Black',sans-serif; font-size:196px; fill:var(--ink); }
    </style>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <circle cx="3" cy="3" r="2.2" fill="#0b0b0b" opacity=".16"/>
    </pattern>
  </defs>

  <rect width="1536" height="838" fill="var(--paper)"/>

  <!-- Color blocks -->
  <rect x="418" y="242" width="312" height="263" fill="var(--yellow)"/>
  <rect x="700" y="323" width="421" height="182" fill="var(--yellow)"/>
  <rect x="700" y="323" width="421" height="182" fill="url(#dots)"/>
  <rect x="937" y="424" width="80" height="80" fill="var(--pink)"/>

  <!-- Book -->
  <g stroke="var(--ink)" stroke-width="22" stroke-linejoin="round" stroke-linecap="round">
    <!-- cover edge -->
    <path d="M474,215 L492,163 L508,198 L606,378 L606,408 L636,408 L636,440 L744,440 L744,474 L604,474 L474,268 Z" fill="var(--yellow)"/>
    <!-- left page -->
    <path d="M520,164 L672,164 L716,182 L740,202 L770,262 L840,385 L650,385 Z" fill="#fff"/>
    <!-- right page -->
    <path d="M772,176 L924,158 L1070,348 L1030,336 L930,378 L850,380 L838,385 L762,212 Z" fill="#fff"/>
    <!-- base -->
    <path d="M636,418 L765,418 L805,456 L860,420 L1052,412 L1070,432 L1100,462" fill="none"/>
  </g>
  <!-- page text lines -->
  <g stroke="var(--ink)" stroke-width="7" stroke-linecap="round" opacity=".35" fill="none">
    <path d="M702,222 L792,356"/><path d="M736,214 L826,350"/>
    <path d="M845,205 L958,196 M880,246 L988,236 M912,290 L1004,282"/>
  </g>
  <!-- cover ticks -->
  <path d="M512,258 L522,252 L526,280 M536,292 L550,312 M546,336 L560,346" stroke="var(--ink)" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Circuit traces -->
  <g stroke="var(--ink)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M680,282 H838" stroke-width="12"/>
    <path d="M838,282 L846,304 M826,298 L834,330 L870,320 L862,298" stroke-width="10"/>
    <path d="M855,336 V462 H1135" stroke-width="12"/>
    <path d="M977,476 V538" stroke-width="12"/>
  </g>
  <circle cx="665" cy="282" r="23" fill="var(--ink)"/>
  <circle cx="977" cy="464" r="19" fill="#fff" stroke="var(--ink)" stroke-width="10"/>
  <circle cx="977" cy="464" r="5" fill="var(--ink)"/>

  <!-- Teal arrow -->
  <polygon points="1130,455 1178,455 1178,420 1244,464 1178,510 1178,473 1130,473" fill="var(--teal)" stroke="var(--teal)" stroke-width="4" stroke-linejoin="round"/>

  <!-- Download icon -->
  <g fill="var(--ink)">
    <rect x="331" y="420" width="33" height="7" rx="2"/>
    <rect x="331" y="432" width="33" height="7" rx="2"/>
    <rect x="341" y="456" width="12" height="16"/>
    <polygon points="315,471 380,471 347,507"/>
  </g>

  <!-- Wordmark (live text) -->
  <text class="word" x="305" y="670" textLength="535" lengthAdjust="spacingAndGlyphs">CODEX</text>

  <!-- Custom L -->
  <g fill="var(--ink)">
    <rect x="849" y="500" width="9" height="195"/>
    <polygon points="880,488 887,488 866,645 859,645"/>
    <rect x="858" y="640" width="164" height="30"/>
  </g>

  <!-- Ring O -->
  <circle cx="977" cy="586" r="45" fill="#fff" stroke="var(--ink)" stroke-width="14"/>
  <circle cx="977" cy="586" r="10" fill="var(--ink)"/>

  <text class="word" x="1040" y="670" textLength="196" lengthAdjust="spacingAndGlyphs">RE</text>
</svg>
